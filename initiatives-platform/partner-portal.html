<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الشركاء — منصة المبادرات</title>
  <meta name="description" content="بوابة شركاء أمانة منطقة المدينة المنورة: كل جهة تتابع مبادراتها وتقدمها ومنافعها بحسابها الخاص.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/logo-placeholder.svg" type="image/svg+xml">
  <meta name="theme-color" content="#073B2E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/navigation.css">
  <link rel="stylesheet" href="./css/forms.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/themes.css">
</head>
<body>
  <header class="mi-page-head-bar">
    <a class="mi-sidebar__brand" href="./index.html">
      <span class="mi-brand-arch" aria-hidden="true"></span>
      <span class="mi-brand-text"><b>منصة المبادرات</b><small>أمانة منطقة المدينة المنورة</small></span>
    </a>
    <div class="mi-portal-user" id="mi-portal-user" hidden>
      <span class="mi-portal-user__name" id="mi-portal-user-name"></span>
      <button class="mi-btn mi-btn--ghost mi-btn--sm" id="mi-portal-logout">خروج ⎋</button>
    </div>
    <a class="mi-back" href="./index.html" id="mi-portal-back">← العودة للبوابة</a>
  </header>

  <main class="mi-page-plain mi-page-plain--wide" id="mi-partner-main">
    <h1>بوابة الشركاء</h1>
    <p class="mi-muted" id="mi-portal-lead">متابعة مبادرات جهتكم وتقدمها ومنافعها — اطلاع للقراءة فقط.</p>
    <div class="mi-form-field" id="mi-partner-select-wrap" style="max-width:24rem;display:none" hidden>
      <label for="mi-partner-select">الجهة الشريكة (عرض إشرافي)</label>
      <select class="mi-input" id="mi-partner-select"></select>
    </div>
    <div id="mi-partner-content"></div>
  </main>

  <script type="module">
    import { APP_CONFIG } from './js/config.js';
    import { initDataProvider } from './js/data/data-provider.js';
    import { seedDemoDataIfEmpty } from './js/services/import-service.js';
    import { ensureAuthSeed, logout, restoreCloudSession } from './js/services/auth-service.js';
    import { getSession } from './js/core/state.js';
    import { isCloudMode } from './js/config.js';
    import { repos } from './js/data/repositories.js';
    import { html, raw, escapeHtml } from './js/core/sanitizer.js';
    import { statusBadge, gateTrackHtml, definitionList, progressBar } from './js/ui/components.js';
    import { statusLabel } from './js/domain/workflow.js';
    import { partnerTypeLabel, modelLabel } from './js/domain/partner-model.js';
    import { categoryLabel } from './js/domain/initiative-model.js';
    import { realizationPercent, benefitStatus } from './js/domain/benefits.js';
    import { fmtMoney, fmtNumber, sum, percent, sortBy } from './js/core/utils.js';
    import { fmtDate } from './js/core/date-time.js';
    import { PRIORITY_LABELS } from './js/domain/infrastructure-need-model.js';
    import { PARTNERSHIP_MODELS } from './js/core/constants.js';
    import { applyToNeed, APPLICATION_STATUS, updateApplicationDetails } from './js/services/application-service.js';
    import { APPLICATION_FIELDS, formatDetail, detailsCompleteness } from './js/domain/application-details.js';
    import { openModal } from './js/ui/modal.js';
    import { toastSuccess, toastError } from './js/ui/toast.js';
    import { partnerApprove, openAgreementViewer, computeAgreementStatus, agreementStatusLabel } from './js/services/agreement-service.js';
    import { submitProgressReport, REPORT_STATUS, MAX_REPORT_PHOTOS } from './js/services/progress-report-service.js';
    import { compressImage } from './js/services/image-service.js';
    import { partnerScorecard } from './js/domain/partner-scorecard.js';
    import { ratingStarsHtml } from './js/ui/components.js';
    import { fmtDateTime } from './js/core/date-time.js';

    const REVIEW_ROLES = ['admin', 'pmo', 'supervisor', 'reviewer', 'viewer'];

    (async () => {
      await initDataProvider(APP_CONFIG);
      await seedDemoDataIfEmpty();
      await ensureAuthSeed();
      if (isCloudMode()) await restoreCloudSession();

      const main = document.getElementById('mi-partner-main');
      const content = document.getElementById('mi-partner-content');
      const session = getSession();

      // البوابة تتطلب تسجيل الدخول — حساب شريك أو حساب إشرافي
      // مع إمكانية تسجيل حساب جديد للشركاء (يُفعَّل بعد اعتماد مدير النظام)
      // فرصة مقصودة بالتقديم (من صفحة التفاصيل): تُحفظ حتى بعد تسجيل الدخول وإعادة التوجيه
      const applyParam = new URLSearchParams(location.search).get('apply');
      if (applyParam) sessionStorage.setItem('madinahInitiativesPlatform:pendingApply', applyParam);

      if (!session) {
        const { renderPartnerRegistration } = await import('./js/modules/public-portal/partner-registration.js');
        renderPartnerRegistration(content);
        if (applyParam) {
          const note = document.createElement('p');
          note.className = 'mi-alert mi-alert--info';
          note.textContent = 'سجّل الدخول بحساب جهتكم (أو أنشئ حسابًا) وسيُفتح نموذج التقديم على الفرصة التي اخترتها مباشرة.';
          content.prepend(note);
        }
        return;
      }

      // شريط المستخدم + خروج
      document.getElementById('mi-portal-back').hidden = true;
      const userBar = document.getElementById('mi-portal-user');
      userBar.hidden = false;
      document.getElementById('mi-portal-user-name').textContent = session.name;
      document.getElementById('mi-portal-logout').addEventListener('click', () => {
        logout();
        location.replace('./login.html');
      });

      const [partners, links, initiatives, benefits, milestones, needs, allApplications] = await Promise.all([
        repos.partners.getAll(), repos.initiativePartners.getAll(),
        repos.initiatives.getAll(), repos.benefits.getAll(), repos.milestones.getAll(),
        repos.needs.getAll(),
        // جدول الطلبات غير مهيأ بعد في وضع السحابة — تجاهل بأمان
        repos.needApplications.getAll().catch(() => [])
      ]);
      const [qualityChecks, progressReports, allAgreements] = await Promise.all([
        repos.qualityChecks.getAll().catch(() => []),
        repos.progressReports.getAll().catch(() => []),
        repos.agreements.getAll().catch(() => [])
      ]);

      const isPartnerAccount = session.role === 'partner' && session.partnerId;
      const canBrowseAll = REVIEW_ROLES.includes(session.role);

      if (!isPartnerAccount && !canBrowseAll) {
        content.innerHTML = html`
          <div class="mi-card mi-empty">
            <div class="mi-empty__mark" aria-hidden="true">◈</div>
            <h2>حسابك غير مرتبط بجهة شريكة</h2>
            <p class="mi-muted">تواصل مع مدير النظام لربط حسابك بجهتكم من شاشة «المستخدمون».</p>
          </div>`;
        return;
      }

      // الحسابات الإشرافية فقط ترى محدد الجهات — حساب الشريك مقفول على جهته
      const selectWrap = document.getElementById('mi-partner-select-wrap');
      const select = document.getElementById('mi-partner-select');
      if (canBrowseAll) {
        selectWrap.hidden = false;
        selectWrap.style.display = '';
        select.innerHTML = partners.map((p) => `<option value="${p.id}">${p.name}</option>`).join('');
        select.addEventListener('change', () => draw(select.value));
      } else {
        selectWrap.remove(); // حساب الشريك: لا محدد جهات إطلاقًا
        document.getElementById('mi-portal-lead').textContent =
          'مرحبًا بكم — هنا تتابعون مبادرات جهتكم، وترفعون تقارير التقدم الميدانية، وتعتمدون اتفاقيات الشراكة، وتقدمون على الفرص المطروحة.';
      }

      function roleTextOf(link) {
        return link.model ? modelLabel(link.model) : 'جهة مقدمة للمبادرة';
      }

      // قسم الفرص: المطروحة للتقديم + طلبات الجهة وحالتها — لحسابات الشركاء فقط
      function opportunitiesSection(partnerId) {
        const myApps = sortBy(allApplications.filter((a) => a.partnerId === partnerId), (a) => a.at, 'desc');
        const appliedNeedIds = new Set(myApps.map((a) => a.needId));
        const openNeeds = needs.filter((n) => n.status === 'published');

        const needCards = openNeeds.length ? openNeeds.map((n) => {
          const applied = appliedNeedIds.has(n.id);
          return html`
            <article class="mi-opportunity-card">
              <div class="mi-opportunity-card__arch" aria-hidden="true"></div>
              <span class="mi-tag mi-tag--priority" data-priority="${n.priority}">${PRIORITY_LABELS[n.priority] || n.priority}</span>
              <h3>${n.title}</h3>
              <p class="mi-opportunity-card__meta">${categoryLabel(n.category)}${n.location ? raw(' • ' + escapeHtml(n.location)) : ''}</p>
              <p class="mi-opportunity-card__desc">${n.description.length > 140 ? n.description.slice(0, 137) + '…' : n.description}</p>
              <div class="mi-opportunity-card__facts">
                <span>التكلفة التقديرية: <b>${fmtMoney(n.estimatedCost)}</b></span>
                <span>المستفيدون: <b>${fmtNumber(n.beneficiaries || 0)}</b></span>
              </div>
              <div class="mi-opportunity-card__models">${raw((n.preferredModels || []).map((m) => `<span class="mi-tag">${escapeHtml(modelLabel(m))}</span>`).join(' '))}</div>
              ${applied
              ? raw('<p class="mi-muted"><span class="mi-tag" data-benefit="onTrack">سبق التقديم — بانتظار المفاضلة</span></p>')
              : raw(`<button class="mi-btn mi-btn--primary" data-apply-need="${escapeHtml(n.id)}">التقديم على الفرصة</button>`)}
              <a class="mi-btn mi-btn--ghost mi-btn--sm" href="./opportunity.html?id=${encodeURIComponent(n.id)}">تفاصيل الفرصة</a>
            </article>`;
        }).join('') : '<p class="mi-muted">لا فرص مطروحة حاليًا — تُعرض هنا فور طرحها.</p>';

        const appsRows = myApps.length ? myApps.map((a) => {
          const need = needs.find((n) => n.id === a.needId);
          const st = APPLICATION_STATUS[a.status] || APPLICATION_STATUS.applied;
          const badge = a.status === 'accepted' ? 'achieved' : a.status === 'rejected' ? 'atRisk' : 'onTrack';
          const comp = detailsCompleteness(a.details || {});
          const FMT = { fmtMoney, fmtNumber, fmtDate };
          const filled = APPLICATION_FIELDS.filter((f) => a.details?.[f.id] !== undefined && a.details?.[f.id] !== '' && f.type !== 'text');
          return html`
            <div class="mi-ms" data-done="${a.status === 'accepted' ? 'yes' : 'no'}" style="align-items:flex-start">
              <span class="mi-ms__dot" aria-hidden="true" style="margin-top:0.45rem"></span>
              <span style="flex:1">«${need?.title || a.needId}» — ${modelLabel(a.model)}
                ${a.status === 'accepted' ? raw(' <small class="mi-muted">(اعتُمد وأُنشئت مبادرة الشراكة — تظهر ضمن مبادراتكم أعلاه)</small>') : ''}
                ${a.status === 'rejected' && a.decisionReason ? raw(` <small class="mi-muted">— ${escapeHtml(a.decisionReason)}</small>`) : ''}
                <div class="mi-details-summary">
                  ${raw(filled.slice(0, 6).map((f) => `<span>${escapeHtml(f.label)}: <b>${escapeHtml(formatDetail(f, a.details[f.id], FMT))}</b></span>`).join(''))}
                  <span>اكتمال البيانات التفصيلية: <b>${fmtNumber(comp.percent)}٪</b>${comp.percent < 100 && a.status === 'applied' ? raw(' <small class="mi-compare__missing">— استكملوها لتقوية موقفكم في المفاضلة</small>') : ''}</span>
                </div>
                ${a.status === 'applied' ? raw(`<button class="mi-btn mi-btn--ghost mi-btn--sm" type="button" data-edit-app="${escapeHtml(a.id)}">تعديل البيانات التفصيلية</button>`) : ''}
              </span>
              <span class="mi-tag" data-benefit="${badge}">${st.label}</span>
              <small>${fmtDate(a.at)}</small>
            </div>`;
        }).join('') : '<p class="mi-muted">لم تقدموا على فرص بعد.</p>';

        return html`
          <h2 class="mi-subhead" style="margin-top:1.5rem">فرص متاحة للتقديم</h2>
          <p class="mi-muted">اختاروا فرصة واكتبوا مقترح مساهمتكم — تُدرس الطلبات في مرحلة الفرز ويجوز اعتماد أكثر من جهة بشراكة مشتركة.</p>
          <div class="mi-opportunities-grid">${raw(needCards)}</div>
          <div class="mi-card" style="margin-top:1.5rem">
            <h3>طلبات تقديمكم</h3>
            ${raw(appsRows)}
          </div>`;
      }

      // نافذة التقديم على فرصة: نموذج الشراكة + مقترح المساهمة
      // حقول البيانات التفصيلية مجمّعة حسب المجموعة — تُستخدم في التقديم والتعديل
      function detailsFieldsHtml(values = {}) {
        const groups = [...new Set(APPLICATION_FIELDS.map((f) => f.group))];
        return groups.map((g) => html`
          <fieldset class="mi-form-field mi-apply-group"><legend>${g}</legend>
            <div class="mi-form-row">
              ${raw(APPLICATION_FIELDS.filter((f) => f.group === g).map((f) => {
                const v = values[f.id] ?? '';
                const id = `mi-d-${f.id}`;
                let input;
                if (f.type === 'select') input = `<select class="mi-input" id="${id}" data-detail="${f.id}"><option value="">—</option>${f.options.map((o) => `<option value="${o.id}" ${o.id === v ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}</select>`;
                else if (f.type === 'text') input = `<textarea class="mi-input" id="${id}" data-detail="${f.id}" rows="2">${escapeHtml(v)}</textarea>`;
                else if (f.type === 'date') input = `<input class="mi-input" id="${id}" data-detail="${f.id}" type="date" value="${escapeHtml(v)}">`;
                else input = `<input class="mi-input" id="${id}" data-detail="${f.id}" type="number" min="0" ${f.type === 'percent' ? 'max="100"' : ''} step="${f.type === 'money' ? '1000' : '1'}" value="${escapeHtml(String(v))}">`;
                return `<div class="mi-form-field ${f.type === 'text' ? 'mi-form-field--wide' : ''}"><label for="${id}">${escapeHtml(f.label)}${f.unit ? ` <small class="mi-muted">(${escapeHtml(f.unit)})</small>` : ''}</label>${input}</div>`;
              }).join(''))}
            </div>
          </fieldset>`).join('');
      }
      function readDetails(dialog) {
        const out = {};
        dialog.querySelectorAll('[data-detail]').forEach((el) => { if (el.value !== '') out[el.dataset.detail] = el.value; });
        return out;
      }

      // نافذة التقديم على فرصة: بيانات الجهة (تلقائيًا) + البيانات التفصيلية + المقترح
      function openApplyModal(need, partnerId) {
        if (!need) return;
        const partner = partners.find((p) => p.id === partnerId) || {};
        const { dialog, close } = openModal({
          title: `التقديم على «${need.title}»`,
          wide: true,
          bodyHtml: html`
            <form class="mi-form" id="mi-apply-form">
              <p class="mi-muted">${categoryLabel(need.category)}${need.location ? raw(' • ' + escapeHtml(need.location)) : ''} • التكلفة التقديرية ${fmtMoney(need.estimatedCost)}</p>
              <h4 class="mi-subhead">1) بيانات الجهة الأساسية <small class="mi-muted">— تُسجَّل تلقائيًا من حسابكم</small></h4>
              <div class="mi-apply-basic">
                <div><span>الجهة</span>${partner.name || '—'}</div>
                <div><span>النوع</span>${partnerTypeLabel(partner.type)}</div>
                <div><span>الممثل</span>${partner.contactName || '—'}</div>
                <div><span>التواصل</span>${partner.contactEmail || '—'} ${partner.contactPhone ? raw(' • ' + escapeHtml(partner.contactPhone)) : ''}</div>
                <div><span>نماذج الشراكة المتاحة</span>${(partner.models || []).map(modelLabel).join('، ') || '—'}</div>
              </div>
              <h4 class="mi-subhead">2) بيانات المقترح التفصيلية <small class="mi-muted">— تُقارن بها الطلبات في الفرز</small></h4>
              <div class="mi-form-field">
                <label for="mi-apply-model">نموذج الشراكة المقترح</label>
                <select class="mi-input" id="mi-apply-model" name="model">
                  ${raw(PARTNERSHIP_MODELS.map((m) => `<option value="${m.id}" ${(need.preferredModels || [])[0] === m.id ? 'selected' : ''}>${m.label}</option>`).join(''))}
                </select>
              </div>
              ${raw(detailsFieldsHtml({}))}
              <h4 class="mi-subhead">3) المقترح</h4>
              <div class="mi-form-field">
                <label for="mi-apply-proposal">مقترح مساهمتكم (20 حرفًا على الأقل)</label>
                <textarea class="mi-input" id="mi-apply-proposal" name="proposal" rows="4" required
                  placeholder="ماذا ستقدم جهتكم؟ نطاق الأعمال، التمويل أو التنفيذ، المدة المتوقعة…"></textarea>
              </div>
            </form>`,
          footerHtml: html`
            <button class="mi-btn mi-btn--ghost" data-act="cancel">إلغاء</button>
            <button class="mi-btn mi-btn--primary" data-act="send">إرسال الطلب</button>`
        });
        dialog.querySelector('[data-act="cancel"]').addEventListener('click', close);
        dialog.querySelector('[data-act="send"]').addEventListener('click', async () => {
          try {
            await applyToNeed({
              need,
              session,
              model: dialog.querySelector('#mi-apply-model').value,
              proposal: dialog.querySelector('#mi-apply-proposal').value,
              details: readDetails(dialog)
            });
            toastSuccess('أُرسل طلبكم — يُبَت فيه في مرحلة الفرز');
            close();
            location.reload();
          } catch (err) {
            toastError(err.message || 'تعذر إرسال الطلب');
          }
        });
      }

      // تعديل البيانات التفصيلية لطلب قائم لم يُبت فيه
      function openDetailsEditModal(app) {
        if (!app) return;
        const { dialog, close } = openModal({
          title: `البيانات التفصيلية — «${needs.find((n) => n.id === app.needId)?.title || app.needId}»`,
          wide: true,
          bodyHtml: html`<form class="mi-form">${raw(detailsFieldsHtml(app.details || {}))}</form>`,
          footerHtml: html`
            <button class="mi-btn mi-btn--ghost" data-act="cancel">إلغاء</button>
            <button class="mi-btn mi-btn--primary" data-act="save">حفظ البيانات</button>`
        });
        dialog.querySelector('[data-act="cancel"]').addEventListener('click', close);
        dialog.querySelector('[data-act="save"]').addEventListener('click', async () => {
          try {
            await updateApplicationDetails(app.id, readDetails(dialog), session);
            close();
            toastSuccess('حُفظت البيانات التفصيلية');
            location.reload();
          } catch (err) { toastError(err.message); }
        });
      }

      function initiativeCard(link, ini) {
        const ms = sortBy(milestones.filter((m) => m.initiativeId === ini.id), (m) => m.due);
        const done = ms.filter((m) => m.done).length;
        const progressPct = ini.progressPercentage || (ms.length ? percent(done, ms.length) : null);
        const myBenefits = benefits.filter((b) => b.initiativeId === ini.id);
        const history = sortBy([...(ini.statusHistory || [])], (h) => h.at, 'desc').slice(0, 3);
        const myReports = sortBy(progressReports.filter((r) => r.initiativeId === ini.id && r.partnerId === link.partnerId), (r) => r.at, 'desc');
        const canReport = isPartnerAccount && link.partnerId && ['execution', 'benefits'].includes(ini.status);

        return html`
          <div class="mi-card" style="margin-top:1rem" data-ini-card="${ini.id}">
            <div class="mi-detail-head">
              <div>
                <h3>${ini.title}</h3>
                <p class="mi-muted">${ini.id} • ${categoryLabel(ini.category)}${ini.location ? raw(' • ' + escapeHtml(ini.location)) : ''}
                  • دور جهتكم: <b>${roleTextOf(link)}</b>${link.contribution ? raw(' — ' + escapeHtml(link.contribution)) : ''}</p>
              </div>
              ${raw(statusBadge(ini.status))}
            </div>
            ${raw(gateTrackHtml(ini.status))}
            ${canReport ? raw(html`
              <h4 class="mi-subhead">تقارير التقدم الميدانية لجهتكم
                <button class="mi-btn mi-btn--gold mi-btn--sm" type="button" data-report-ini="${ini.id}">رفع تقرير تقدم ميداني</button></h4>
              ${myReports.length ? raw(myReports.map((r) => {
                const st = REPORT_STATUS[r.status] || REPORT_STATUS.pending;
                const tone = r.status === 'approved' ? 'achieved' : r.status === 'rejected' ? 'atRisk' : 'onTrack';
                const ms = milestones.find((m) => m.id === r.milestoneId);
                return html`<div class="mi-field-report" data-status="${r.status}">
                  <div class="mi-field-report__head"><div><span class="mi-field-report__pct">${fmtNumber(r.percent)}٪</span> ${ms ? raw(`<span class="mi-tag">${escapeHtml(ms.title)}</span>`) : ''}</div>
                    <div class="mi-field-report__meta"><span class="mi-tag" data-benefit="${tone}">${st.label}</span><small class="mi-muted">${fmtDateTime(r.at)}</small></div></div>
                  <p class="mi-field-report__note">${r.note}</p>
                  ${(r.photos || []).length ? raw(`<div class="mi-field-report__photos">${r.photos.map((p) => `<img alt="" loading="lazy" src='${p}'>`).join('')}</div>`) : ''}
                  ${r.status === 'rejected' && r.reviewNote ? raw(`<small class="mi-alert mi-alert--error">سبب الرفض: ${escapeHtml(r.reviewNote)}</small>`) : ''}
                </div>`;
              }).join('')) : raw('<p class="mi-muted">لم ترفعوا تقارير بعد — يُعتمد كل تقرير من مكتب إدارة المبادرات قبل نشر الإنجاز.</p>')}`) : ''}
            ${progressPct !== null ? raw(html`
              <h4 class="mi-subhead">نسبة الإنجاز${ms.length ? raw(` <small class="mi-muted">(${escapeHtml(fmtNumber(done))} من ${escapeHtml(fmtNumber(ms.length))} معلمًا)</small>`) : ''}</h4>
              ${raw(progressBar(progressPct, 'نسبة إنجاز ' + ini.title))}`) : ''}
            ${ms.length ? raw('<h4 class="mi-subhead">معالم التنفيذ</h4>' + ms.map((m) => html`
              <div class="mi-ms" data-done="${m.done ? 'yes' : 'no'}">
                <span class="mi-ms__dot" aria-hidden="true"></span>
                <span>${m.title}</span>
                <small>${fmtDate(m.due)}</small>
              </div>`).join('')) : ''}
            ${history.length ? raw('<h4 class="mi-subhead">آخر التحديثات</h4>' + history.map((h) => html`
              <div class="mi-ms"><span class="mi-ms__dot" style="background:var(--mi-green-500)"></span>
                <span>${statusLabel(h.from)} ← ${statusLabel(h.to)}</span>
                <small>${fmtDate(h.at)}</small>
              </div>`).join('')) : ''}
            ${myBenefits.length ? raw('<h4 class="mi-subhead">المنافع المعلنة</h4>' + myBenefits.map((b) => {
        const p = realizationPercent(b);
        return html`<div class="mi-ms"><span class="mi-ms__dot" style="background:var(--mi-gold-500)"></span>
                <span>${b.title}</span>
                <small>${p === null ? 'لم تُقس بعد' : benefitStatus(b).label + ' — ' + fmtNumber(Math.min(p, 100)) + '٪'}</small></div>`;
      }).join('')) : ''}
          </div>`;
      }

      function draw(partnerId) {
        const partner = partners.find((p) => p.id === partnerId);
        if (!partner) {
          content.innerHTML = html`
            <div class="mi-card mi-empty">
              <h2>سجل الجهة غير موجود</h2>
              <p class="mi-muted">تواصل مع مكتب إدارة المبادرات لتحديث ربط حسابكم.</p>
            </div>`;
          return;
        }
        const myLinks = links.filter((l) => l.partnerId === partnerId);
        const myInis = myLinks
          .map((l) => ({ link: l, ini: initiatives.find((i) => i.id === l.initiativeId) }))
          .filter((x) => x.ini);
        // المبادرات التي قدمتها الجهة بنفسها (مطابقة بريد الممثل) ولم تُربط رسميًا بعد
        const linkedIds = new Set(myInis.map((x) => x.ini.id));
        const email = (partner.contactEmail || '').trim().toLowerCase();
        const submittedByMe = email
          ? initiatives.filter((i) => !linkedIds.has(i.id)
            && (i.submitterEmail || '').trim().toLowerCase() === email)
          : [];
        const allMine = [...myInis, ...submittedByMe.map((ini) => ({ link: { model: null, contribution: '' }, ini }))];
        const running = allMine.filter((x) => ['execution', 'benefits'].includes(x.ini.status)).length;
        const closed = allMine.filter((x) => x.ini.status === 'closed').length;
        const totalValue = sum(allMine, (x) => x.ini.budget);
        // بطاقة الأداء المحسوبة من السجل الفعلي
        const card = partnerScorecard({ partnerId, links, initiatives, milestones, benefits, qualityChecks, progressReports });
        const myAgreements = sortBy(allAgreements.filter((a) => a.status !== 'cancelled' && (a.parties || []).some((p) => p.partnerId === partnerId)), (a) => a.issuedAt, 'desc');

        content.innerHTML = html`
          <div class="mi-card" style="margin-top:1rem">
            <h2>${partner.name}</h2>
            ${raw(definitionList([
          ['نوع الجهة', partnerTypeLabel(partner.type)],
          ['ممثل الجهة', partner.contactName || '—'],
          ['عدد المبادرات', fmtNumber(allMine.length)],
          ['قيد التنفيذ حاليًا', fmtNumber(running)],
          ['مكتملة', fmtNumber(closed)],
          ['قيمة المبادرات المرتبطة', fmtMoney(totalValue)],
          ['بطاقة الأداء', card.overall !== null ? `${card.rating}/5 (${fmtNumber(card.overall)}/100) — ${card.band.label}` : card.band.label]
        ]))}
            ${card.overall !== null ? raw(`<div class="mi-scorecard"><div class="mi-scorecard__head"><h4 class="mi-subhead">بطاقة الأداء المحسوبة</h4><div class="mi-scorecard__overall"><b>${escapeHtml(fmtNumber(card.overall))}</b><small>/100</small><div>${ratingStarsHtml(card.rating, { label: card.band.label })}</div></div></div>${card.components.map((c) => `
              <div class="mi-scorecard__row" data-available="${c.available ? 'yes' : 'no'}">
                <span>${escapeHtml(c.label)}</span>
                <span class="mi-hbar__track"><span class="mi-hbar__fill" style="width:${c.available ? c.value : 0}%"></span></span>
                <b>${c.available ? escapeHtml(fmtNumber(c.value)) + '٪' : 'لا بيانات'}</b>
              </div>`).join('')}<small class="mi-muted">يُحسب التقييم آليًا من الالتزام بمواعيد المعالم وفحوص الجودة وتحقق المنافع وتقاريركم الميدانية المعتمدة، ويُغذي المفاضلة على الفرص القادمة.</small></div>`) : ''}
          </div>

          ${myAgreements.length ? raw(html`
          <div class="mi-card" style="margin-top:1rem">
            <h3>اتفاقيات الشراكة</h3>
            ${raw(myAgreements.map((a) => {
              const st = computeAgreementStatus(a);
              const me = a.parties.find((p) => p.partnerId === partnerId);
              const tone = st === 'signed' ? 'achieved' : 'onTrack';
              return html`
                <div class="mi-field-report" data-status="${me?.approvedAt ? 'approved' : 'pending'}">
                  <div class="mi-field-report__head">
                    <div><b>${a.id}</b> — ${a.initiativeTitle}<br><small class="mi-muted">${me?.modelLabel || ''}${me?.contribution ? raw(' — ' + escapeHtml(me.contribution)) : ''} • صدرت ${fmtDate(a.issuedAt)}</small></div>
                    <div class="mi-field-report__meta"><span class="mi-tag" data-benefit="${tone}">${agreementStatusLabel(st)}</span></div>
                  </div>
                  <div class="mi-field-report__actions">
                    <button class="mi-btn mi-btn--ghost mi-btn--sm" type="button" data-agr-view="${a.id}">عرض / طباعة الاتفاقية</button>
                    ${isPartnerAccount && me && !me.approvedAt ? raw(`<button class="mi-btn mi-btn--gold mi-btn--sm" type="button" data-agr-approve="${escapeHtml(a.id)}">اعتماد الاتفاقية إلكترونيًا</button>`) : ''}
                    ${me?.approvedAt ? raw(`<small class="mi-muted">اعتمدتها جهتكم في ${escapeHtml(fmtDate(me.approvedAt))} — ${escapeHtml(me.approvedBy || '')}</small>`) : ''}
                  </div>
                </div>`;
            }).join(''))}
          </div>`) : ''}
          ${isPartnerAccount ? raw(html`
          <div class="mi-card" style="margin-top:1rem">
            <h3>تعبئة / تحديث بيانات جهتكم</h3>
            <p class="mi-muted">تُدقق التحديثات الجوهرية من مكتب إدارة المبادرات عند الحاجة.</p>
            <form class="mi-form" id="mi-partner-selfedit">
              <div class="mi-form-row">
                <div class="mi-form-field"><label>ممثل الجهة</label>
                  <input class="mi-input" name="contactName" value="${partner.contactName || ''}"></div>
                <div class="mi-form-field"><label>البريد الإلكتروني</label>
                  <input class="mi-input" name="contactEmail" type="email" dir="ltr" value="${partner.contactEmail || ''}"></div>
                <div class="mi-form-field"><label>رقم الجوال</label>
                  <input class="mi-input" name="contactPhone" dir="ltr" value="${partner.contactPhone || ''}"></div>
              </div>
              <div class="mi-form-field"><label>نبذة / ملاحظات عن الجهة</label>
                <textarea class="mi-input" name="notes" rows="2">${partner.notes || ''}</textarea></div>
              <button class="mi-btn mi-btn--primary mi-btn--sm" type="submit">حفظ بيانات الجهة</button>
            </form>
          </div>`) : ''}

          ${myInis.length ? raw('<h2 class="mi-subhead" style="margin-top:1.5rem">مبادرات بشراكة رسمية</h2>' +
        myInis.map(({ link, ini }) => initiativeCard(link, ini)).join('')) : ''}
          ${submittedByMe.length ? raw('<h2 class="mi-subhead" style="margin-top:1.5rem">مبادرات قدمتموها عبر المنصة</h2>' +
        submittedByMe.map((ini) => initiativeCard({ model: null, contribution: '' }, ini)).join('')) : ''}
          ${!allMine.length
          ? raw('<div class="mi-card mi-empty" style="margin-top:1rem"><h3>لا مبادرات مرتبطة بجهتكم بعد</h3><p class="mi-muted">قدموا على إحدى الفرص المطروحة أدناه — وعند اعتماد المفاضلة تظهر المبادرة هنا.</p></div>')
          : ''}

          ${isPartnerAccount ? raw(opportunitiesSection(partnerId)) : ''}`;

        // ربط أزرار التقديم على الفرص
        content.querySelectorAll('[data-apply-need]').forEach((btn) =>
          btn.addEventListener('click', () => openApplyModal(
            needs.find((n) => n.id === btn.dataset.applyNeed), partnerId)));

        content.querySelectorAll('[data-edit-app]').forEach((btn) => btn.addEventListener('click', () =>
          openDetailsEditModal(allApplications.find((a) => a.id === btn.dataset.editApp))));

        // الاتفاقيات: عرض واعتماد إلكتروني
        content.querySelectorAll('[data-agr-view]').forEach((btn) => btn.addEventListener('click', () => {
          const a = allAgreements.find((x) => x.id === btn.dataset.agrView);
          openAgreementViewer(a, initiatives.find((i) => i.id === a.initiativeId) || null);
        }));
        content.querySelectorAll('[data-agr-approve]').forEach((btn) => btn.addEventListener('click', () => openAgreementApproval(
          allAgreements.find((x) => x.id === btn.dataset.agrApprove))));

        // تقارير التقدم الميدانية
        content.querySelectorAll('[data-report-ini]').forEach((btn) => btn.addEventListener('click', () =>
          openProgressReportModal(initiatives.find((i) => i.id === btn.dataset.reportIni))));

        // حفظ بيانات الجهة (حساب الشريك — بياناته هو فقط)
        content.querySelector('#mi-partner-selfedit')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const f = e.target;
          await repos.partners.update(partner.id, {
            contactName: f.contactName.value.trim(),
            contactEmail: f.contactEmail.value.trim(),
            contactPhone: f.contactPhone.value.trim(),
            notes: f.notes.value.trim()
          });
          const { toastSuccess } = await import('./js/ui/toast.js');
          toastSuccess('حُفظت بيانات جهتكم');
          location.reload();
        });
      }

      // اعتماد الاتفاقية إلكترونيًا: إقرار صريح باسم ممثل الجهة
      function openAgreementApproval(agreement) {
        if (!agreement) return;
        const { dialog, close } = openModal({
          title: `اعتماد الاتفاقية ${agreement.id}`,
          bodyHtml: html`
            <p>«${agreement.initiativeTitle}» — راجعوا نص الاتفاقية كاملًا قبل الاعتماد.</p>
            <p><button class="mi-btn mi-btn--ghost mi-btn--sm" type="button" data-act="view">عرض نص الاتفاقية</button></p>
            <label class="mi-agr-consent"><input type="checkbox" id="mi-agr-consent">
              <span>أقر بصفتي <b>${session.name}</b> ممثلًا عن <b>${partners.find((p) => p.id === session.partnerId)?.name || ''}</b> بأنني اطلعت على بنود الاتفاقية وأوافق عليها، وأن هذا الاعتماد الإلكتروني يُعد بمثابة التوقيع ويُوثَّق بتاريخه في سجل المنصة.</span></label>`,
          footerHtml: html`
            <button class="mi-btn mi-btn--ghost" data-act="cancel">إلغاء</button>
            <button class="mi-btn mi-btn--gold" data-act="ok" disabled>اعتماد وتوقيع إلكتروني</button>`
        });
        const ok = dialog.querySelector('[data-act="ok"]');
        dialog.querySelector('#mi-agr-consent').addEventListener('change', (e) => { ok.disabled = !e.target.checked; });
        dialog.querySelector('[data-act="view"]').addEventListener('click', () => openAgreementViewer(agreement, initiatives.find((i) => i.id === agreement.initiativeId) || null));
        dialog.querySelector('[data-act="cancel"]').addEventListener('click', close);
        ok.addEventListener('click', async () => {
          try {
            const saved = await partnerApprove(agreement.id, session);
            close();
            toastSuccess(computeAgreementStatus(saved) === 'signed' ? 'اكتمل توقيع الاتفاقية من الطرفين' : 'سُجّل اعتماد جهتكم — بانتظار اعتماد الأمانة');
            location.reload();
          } catch (err) { toastError(err.message); }
        });
      }

      // رفع تقرير تقدم ميداني: المَعلم + النسبة + الوصف + حتى 4 صور مضغوطة
      function openProgressReportModal(ini) {
        if (!ini) return;
        const ms = sortBy(milestones.filter((m) => m.initiativeId === ini.id), (m) => m.due);
        const photos = [];
        const { dialog, close } = openModal({
          title: `تقرير تقدم ميداني — ${ini.title}`,
          wide: true,
          bodyHtml: html`
            <form class="mi-form" id="mi-pr-form">
              <div class="mi-form-row">
                <div class="mi-form-field"><label for="mi-pr-ms">المَعلم المرتبط</label>
                  <select class="mi-input" id="mi-pr-ms"><option value="">— تقدم عام للمبادرة —</option>
                    ${raw(ms.map((m) => `<option value="${escapeHtml(m.id)}" ${m.done ? 'disabled' : ''}>${escapeHtml(m.title)}${m.done ? ' (منجز)' : ''}</option>`).join(''))}</select></div>
                <div class="mi-form-field"><label for="mi-pr-pct">نسبة الإنجاز الإجمالية (٪)</label>
                  <input class="mi-input" id="mi-pr-pct" type="number" min="0" max="100" value="${String(ini.progressPercentage || 0)}"></div>
              </div>
              <div class="mi-form-field"><label for="mi-pr-note">وصف الأعمال المنجزة (10 أحرف على الأقل)</label>
                <textarea class="mi-input" id="mi-pr-note" rows="3" placeholder="ما أُنجز ميدانيًا منذ التقرير السابق، وأي معوقات…"></textarea></div>
              <div class="mi-form-field"><label>الصور الميدانية (حتى ${String(MAX_REPORT_PHOTOS)} — تُضغط تلقائيًا)</label>
                <div class="mi-photo-picks" data-picks></div>
                <label class="mi-btn mi-btn--ghost mi-btn--sm mi-file-btn">إضافة صور<input type="file" accept="image/png,image/jpeg,image/webp" multiple hidden data-photos></label></div>
            </form>`,
          footerHtml: html`
            <button class="mi-btn mi-btn--ghost" data-act="cancel">إلغاء</button>
            <button class="mi-btn mi-btn--primary" data-act="send">إرسال التقرير للاعتماد</button>`
        });
        const picks = dialog.querySelector('[data-picks]');
        dialog.querySelector('[data-photos]').addEventListener('change', async (e) => {
          for (const file of [...e.target.files]) {
            if (photos.length >= MAX_REPORT_PHOTOS) { toastError(`الحد الأقصى ${MAX_REPORT_PHOTOS} صور`); break; }
            try { photos.push(await compressImage(file)); } catch (err) { toastError(err.message); }
          }
          picks.innerHTML = photos.map((p) => `<img alt="" src='${p}'>`).join('');
          e.target.value = '';
        });
        dialog.querySelector('[data-act="cancel"]').addEventListener('click', close);
        dialog.querySelector('[data-act="send"]').addEventListener('click', async () => {
          try {
            await submitProgressReport({
              initiative: ini, session,
              milestoneId: dialog.querySelector('#mi-pr-ms').value || null,
              percent: dialog.querySelector('#mi-pr-pct').value,
              note: dialog.querySelector('#mi-pr-note').value,
              photos
            });
            close();
            toastSuccess('أُرسل التقرير — يُعتمد من مكتب إدارة المبادرات ثم يُنشر الإنجاز');
            location.reload();
          } catch (err) { toastError(err.message); }
        });
      }

      if (isPartnerAccount) draw(session.partnerId);
      else if (partners.length) draw(select.value || partners[0].id);

      // فتح نموذج التقديم مباشرة للفرصة المقصودة (بعد الدخول من صفحة تفاصيل الفرصة)
      const pendingApply = sessionStorage.getItem('madinahInitiativesPlatform:pendingApply');
      if (pendingApply) {
        sessionStorage.removeItem('madinahInitiativesPlatform:pendingApply');
        if (isPartnerAccount) {
          const target = needs.find((n) => n.id === pendingApply);
          const already = allApplications.some((a) => a.needId === pendingApply && a.partnerId === session.partnerId);
          if (target && target.status === 'published' && !already) openApplyModal(target, session.partnerId);
          else if (already) toastSuccess('سبق لجهتكم التقديم على هذه الفرصة — تابعوا حالته في «طلبات تقديمكم»');
          document.querySelector('[data-apply-need], .mi-opportunities-grid')?.scrollIntoView({ block: 'start' });
        }
      }
    })().catch((err) => console.error('تعذر تشغيل بوابة الشركاء', err));
  </script>
</body>
</html>
