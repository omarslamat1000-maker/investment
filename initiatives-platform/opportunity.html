<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الفرصة — منصة المبادرات</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/logo-placeholder.svg" type="image/svg+xml">
  <meta name="theme-color" content="#073B2E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/navigation.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/themes.css">
</head>
<body>
  <header class="mi-page-head-bar">
    <a class="mi-sidebar__brand" href="./index.html">
      <span class="mi-brand-arch" aria-hidden="true"></span>
      <span class="mi-brand-text"><b>منصة المبادرات</b><small>أمانة منطقة المدينة المنورة</small></span>
    </a>
    <a class="mi-back" href="./index.html#mi-opportunities">← جميع الفرص</a>
  </header>

  <main class="mi-page-plain" id="mi-opportunity-main">
    <p class="mi-muted">جارٍ التحميل…</p>
  </main>

  <script type="module">
    import { APP_CONFIG } from './js/config.js';
    import { initDataProvider } from './js/data/data-provider.js';
    import { seedDemoDataIfEmpty } from './js/services/import-service.js';
    import { repos } from './js/data/repositories.js';
    import { html, raw } from './js/core/sanitizer.js';
    import { categoryLabel } from './js/domain/initiative-model.js';
    import { PRIORITY_LABELS, needStatusLabel } from './js/domain/infrastructure-need-model.js';
    import { modelLabel } from './js/domain/partner-model.js';
    import { fmtMoney, fmtNumber } from './js/core/utils.js';
    import { definitionList } from './js/ui/components.js';
    import { getSession } from './js/core/state.js';
    import { ensureAuthSeed, restoreCloudSession } from './js/services/auth-service.js';
    import { isCloudMode } from './js/config.js';
    import { APPLICATION_STATUS } from './js/services/application-service.js';

    (async () => {
      await initDataProvider(APP_CONFIG);
      await seedDemoDataIfEmpty();
      await ensureAuthSeed();
      if (isCloudMode()) await restoreCloudSession();
      const main = document.getElementById('mi-opportunity-main');

      // تفاصيل الفرصة للقراءة للجميع — التقديم يتطلب حساب شريك في البوابة
      const session = getSession();
      const id = new URLSearchParams(location.search).get('id');
      const need = id ? await repos.needs.get(id) : null;

      if (!need) {
        main.innerHTML = html`
          <div class="mi-card mi-empty">
            <div class="mi-empty__mark" aria-hidden="true">◈</div>
            <h1>الفرصة غير موجودة</h1>
            <p class="mi-muted">تأكد من الرابط أو تصفح الفرص المطروحة حاليًا.</p>
            <a class="mi-btn mi-btn--primary" href="./index.html#mi-opportunities">جميع الفرص</a>
          </div>`;
        return;
      }

      document.title = `${need.title} — منصة المبادرات`;
      main.innerHTML = html`
        <span class="mi-tag mi-tag--priority" data-priority="${need.priority}">${PRIORITY_LABELS[need.priority] || need.priority}</span>
        <h1>${need.title}</h1>
        <p class="mi-muted">${need.id} • ${categoryLabel(need.category)}${need.location ? raw(' • ' + escapeHtml(need.location)) : ''} • ${needStatusLabel(need.status)}</p>
        <div class="mi-card">
          <p>${need.description}</p>
          ${raw(definitionList([
            ['الموقع', need.location || '—'],
            ['التكلفة التقديرية', fmtMoney(need.estimatedCost)],
            ['المستفيدون المقدَّرون', fmtNumber(need.beneficiaries || 0)],
            ['الأثر المتوقع', need.expectedImpact || '—'],
            ['نماذج الشراكة المفضلة', (need.preferredModels || []).map(modelLabel).join('، ') || '—']
          ]))}
        </div>
        <div class="mi-card" style="margin-top:1rem" id="mi-opportunity-cta">
          <h2>ترغب جهتك في تبنّي هذه الفرصة؟</h2>
          ${session?.partnerId
            ? raw(`<p class="mi-muted">التقديم من بوابة الشركاء بنموذج يضم بيانات جهتكم وبيانات مقترحكم التفصيلية — تُدرس الطلبات في مرحلة الفرز ويجوز اعتماد أكثر من جهة بشراكة مشتركة.</p>
              <a class="mi-btn mi-btn--gold" href="./partner-portal.html?apply=${encodeURIComponent(need.id)}">التقديم على الفرصة</a>`)
            : session
              ? raw('<p class="mi-muted">التقديم على الفرص متاح لحسابات الجهات الشريكة فقط — حسابك الحالي إشرافي.</p>')
              : raw(`<p class="mi-muted">التقديم يتطلب تسجيل الدخول بحساب جهتكم في بوابة الشركاء — أو إنشاء حساب جديد يُعتمد من مدير النظام. بعد الدخول يُفتح نموذج التقديم لهذه الفرصة مباشرة.</p>
              <a class="mi-btn mi-btn--gold" href="./partner-portal.html?apply=${encodeURIComponent(need.id)}">تسجيل الدخول والتقديم</a>
              <a class="mi-btn mi-btn--ghost" href="./partner-portal.html">إنشاء حساب شريك</a>`)}
        </div>`;

      // حساب شريك سبق تقديمه: عرض حالة الطلب بدل دعوة التقديم
      if (session?.partnerId) {
        const apps = await repos.needApplications.getAll().catch(() => []);
        const mine = apps.find((a) => a.needId === need.id && a.partnerId === session.partnerId);
        if (mine) {
          const st = APPLICATION_STATUS[mine.status] || APPLICATION_STATUS.applied;
          const badge = mine.status === 'accepted' ? 'achieved' : mine.status === 'rejected' ? 'atRisk' : 'onTrack';
          document.getElementById('mi-opportunity-cta').innerHTML = html`
            <h2>طلب جهتكم على هذه الفرصة</h2>
            <p><span class="mi-tag" data-benefit="${badge}">${st.label}</span></p>
            <p class="mi-muted">${mine.status === 'accepted'
              ? 'اعتُمد طلبكم وأُنشئت مبادرة الشراكة — تابعوها من بوابة الشركاء.'
              : mine.status === 'rejected'
                ? 'اعتُمدت جهة أخرى لهذه الفرصة — نشكر مبادرتكم ونتطلع لمشاركتكم في فرص قادمة.'
                : 'طلبكم قيد المفاضلة في مرحلة الفرز — تُعلن النتيجة في بوابتكم.'}</p>
            <a class="mi-btn mi-btn--ghost" href="./partner-portal.html">بوابة الشركاء</a>`;
        }
      }
    })().catch((err) => console.error('تعذر تحميل الفرصة', err));
  </script>
</body>
</html>
